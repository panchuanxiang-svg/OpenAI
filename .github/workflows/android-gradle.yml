name: Android CI/CD

# 触发条件配置
on:
  push:
    branches:
      - "master"
      - "main"  # 同时兼容 master 和 main 分支
  pull_request:
    branches:
      - "master"
      - "main"
  workflow_dispatch: # 允许在 GitHub Actions 页面上手动点击按钮触发打包
  
jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取仓库代码
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. 配置 Java 环境 (使用 JDK 21 完美适配项目中的 Gradle 9.x)
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'corretto'
        java-version: '21'
        cache: gradle # 开启缓存，首次打包后，后续打包速度直接起飞

    # 3. 赋予 Gradle 脚本执行权限
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. 执行针对 :android 模块的专属打包命令
    - name: Build APK with Gradle
      run: ./gradlew :android:packageRelease

    # 5. 掘地三尺自动寻找并上传生成的 APK 文件
    - name: Upload APK to Actions
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Bifrost-Android-APK
        path: |
          android/build/outputs/apk/release/*.apk
          **/build/outputs/apk/**/*.apk
        if-no-files-found: error # 如果没找到文件会直接报错提示，方便排查
