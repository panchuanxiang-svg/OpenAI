name: Build for Android

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch: # 支持你在网页上手动点击按钮触发打包

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'corretto'
        java-version: '21'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: |
        ./gradlew :android:packageRelease
        ./gradlew --stop

    - name: Upload APK to Actions
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Bifrost-Android-APK
        path: android/build/outputs/apk/release/*.apk
