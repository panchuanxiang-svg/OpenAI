name: Android CI/CD

# 触发条件配置
on:
  push:
    branches:
      - "master"
      - "main"  # 兼容部分仓库默认叫 main 的情况
  pull_request:
    branches:
      - "master"
      - "main"
  workflow_dispatch: # 👈 允许在 GitHub 页面上手动点击按钮触发打包
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'corretto'
        java-version: '21'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: |
        ./gradlew :android:packageRelease
        ./gradlew --stop

    - name: Upload APK to Actions
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Bifrost-Android-APK
        path: android/build/outputs/apk/release/*.apk
