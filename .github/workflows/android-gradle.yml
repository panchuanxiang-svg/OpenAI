name: Android CI/CD

# 触发条件配置
on:
  push:
    branches:
      - "master"
      - "main"  # 兼容部分仓库默认叫 main 的情况
  pull_request:
    branches:
      - "master"
      - "main"
  workflow_dispatch: # 👈 允许在 GitHub 页面上手动点击按钮触发打包

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. 配置 Java 环境 (Android 开发通常需要 JDK 17 或 11)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle # 开启 gradle 缓存，加速后续打包速度

      # 3. 赋予 Gradle 脚本执行权限（防止出现 Permission Denied 错误）
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 4. 执行 Gradle 编译打包命令
      # 注意：如果你的项目里需要签名，请确保你的 Release 配置已完善；
      # 如果打包失败，可以先尝试改成 ./gradlew assembleDebug 看看能不能成功。
      - name: Build with Gradle
        run: ./gradlew assembleRelease

      # 5. 将打包生成的 APK 文件上传到 GitHub Actions 产物中
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app-release
          # 如果你的项目结构不同，请确保路径正确。通常多模块项目路径为: **/build/outputs/apk/release/*.apk
          path: |
            app/build/outputs/apk/release/*.apk
            **/build/outputs/apk/release/*.apk
          if-no-files-found: error # 如果没找到 APK 文件，直接报错提示，方便排查路径问题
